name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/Unchain/Unchain.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out

      - uses: actions/upload-artifact@v4
        with:
          name: Unchain-win-x64
          path: out/Unchain.exe

      - name: Read version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/Unchain/Unchain.csproj)).Project.PropertyGroup.Version
          "VERSION=$v" >> $env:GITHUB_ENV

      # Релиз создаётся сам при каждом обновлении main: тег v<Version> из csproj
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Unchain ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            Скачай **Unchain.exe** ниже и запусти. .NET ставить не нужно — он встроен.
            Windows попросит права администратора: без них zapret не работает.
          files: out/Unchain.exe
